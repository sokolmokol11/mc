; Скопируй этот файл в config.ini и заполни.
; config.ini НЕЛЬЗЯ загружать на GitHub — в нём ключи от твоего аккаунта.

[telegram]
; Получить на https://my.telegram.org → API development tools
api_id = 1234567
api_hash = 0123456789abcdef0123456789abcdef

[proxy]
; Тот же SOCKS5, через который работают твои боты. Если прокси не нужен — оставь host пустым.
type = socks5
host = 1.2.3.4
port = 1080
username =
password =
